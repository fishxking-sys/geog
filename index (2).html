<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE 地理科詞彙構築器 - 豬豬特訓版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .hidden-phase { display: none !important; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        @keyframes bounce-scale { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 50% { transform: translateX(5px) rotate(5deg); } 75% { transform: translateX(-5px) rotate(-5deg); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-bounce-scale { animation: bounce-scale 1s infinite; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-emerald-50 font-sans text-slate-800 min-h-screen flex flex-col items-center py-6 px-4">

    <!-- 頂部標題與日曆區 -->
    <header class="w-full max-w-2xl bg-white p-5 rounded-3xl shadow-sm mb-6 relative overflow-hidden border-b-4 border-emerald-500">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-emerald-700 flex items-center gap-2 mb-1">
                    🌍 地理科詞彙特訓
                </h1>
                <span id="db-status" class="text-xs text-emerald-600 font-medium bg-emerald-100 px-2 py-1 rounded-md">讀取中...</span>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="openCalendar()" class="flex items-center gap-2 text-amber-600 font-bold bg-amber-50 hover:bg-amber-100 px-4 py-2.5 rounded-xl transition-colors border border-amber-200 shadow-sm">
                    🔥 <span id="streak-display">0</span>日 <span class="text-slate-300">|</span> 💰 $<span id="cash-display">0</span>
                </button>
                <button onclick="openWordBank()" class="flex items-center gap-2 text-emerald-700 font-bold bg-emerald-100 hover:bg-emerald-200 px-4 py-2.5 rounded-xl transition-colors">
                    字庫 (<span id="total-words-count">0</span>)
                </button>
            </div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 mb-1 overflow-hidden">
            <div id="daily-progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center text-sm font-bold">
            <span class="text-slate-500">今日溫習目標</span>
            <span id="daily-text-status" class="text-emerald-600">0 / 5</span>
        </div>
    </header>

    <main class="w-full max-w-2xl flex flex-col items-center">
        <!-- 學習階段 -->
        <div id="study-phase" class="w-full animate-fade-in-up hidden-phase">
            <div class="bg-white p-8 rounded-3xl shadow-sm text-center border-2 border-emerald-50 relative">
                <h2 id="study-word" class="text-4xl font-black text-slate-800 mb-2">WORD</h2>
                <button onclick="speakWord()" class="mb-4 p-2 bg-emerald-100 text-emerald-700 rounded-full hover:bg-emerald-200 transition-colors">🔊</button>
                <p id="study-chinese" class="text-xl font-bold text-emerald-600 mb-4"></p>
                <div id="study-sentence" class="bg-slate-50 p-4 rounded-2xl text-left mb-6 border border-slate-100"></div>

                <!-- AI 助手區塊 -->
                <div class="flex flex-col gap-3 mb-8">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
                        <span class="w-8 h-px bg-slate-200"></span>AI 地理小助手<span class="w-8 h-px bg-slate-200"></span>
                    </div>
                    <button onclick="generateAIStory()" class="w-full py-3 bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold rounded-xl border border-purple-200 transition-colors">✨ 用豬豬解構地理概念</button>
                    <div id="ai-story-container" class="text-left text-sm text-slate-700 bg-purple-50 p-4 rounded-xl border border-purple-100 hidden-phase leading-relaxed"></div>

                    <button onclick="generateAIMnemonic()" class="w-full py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl border border-blue-200 transition-colors">✨ AI 記憶與拆字秘訣</button>
                    <div id="ai-mnemonic-container" class="text-left text-sm text-slate-700 bg-blue-50 p-4 rounded-xl border border-blue-100 hidden-phase leading-relaxed"></div>
                </div>

                <button onclick="startSpelling()" class="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl text-lg hover:bg-emerald-700 transition-transform active:scale-95 shadow-lg shadow-emerald-200">開始拼寫！</button>
            </div>
        </div>

        <!-- 拼寫階段 -->
        <div id="spelling-phase" class="w-full hidden-phase">
            <div class="w-full bg-white p-6 rounded-3xl shadow-sm mb-8 text-center border-2 border-slate-50 relative">
                <button onclick="backToStudy()" class="absolute left-4 top-1/2 -translate-y-1/2 p-2 bg-slate-100 text-slate-500 rounded-full hover:bg-emerald-100 hover:text-emerald-600 transition-colors active:scale-95 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <span id="spelling-chinese" class="text-xl font-bold text-emerald-600"></span>
            </div>
            
            <div id="slots-container" class="flex flex-wrap justify-center gap-2 mb-10 min-h-[3.5rem]"></div>
            <div id="pool-container" class="flex flex-wrap justify-center gap-2"></div>
            
            <!-- 成功區塊 -->
            <div id="success-area" class="hidden-phase text-center mt-6 w-full animate-fade-in-up">
                <div id="daily-goal-celebration" class="hidden-phase w-full text-center bg-gradient-to-r from-emerald-50 to-emerald-100 border-2 border-emerald-400 p-4 rounded-2xl mb-6 shadow-md">
                    <span class="text-xl font-black text-emerald-600">🌟 恭喜達成今日地理溫習目標！ 🌟</span>
                </div>
                <div id="cash-reward-celebration" class="hidden-phase w-full text-center bg-gradient-to-r from-amber-100 to-yellow-300 border-4 border-yellow-500 p-6 rounded-2xl mb-6 shadow-xl animate-bounce-scale">
                    <span class="text-2xl font-black text-rose-600 block mb-1">🎉 獎勵解鎖！ 🎉</span>
                    <span class="text-lg font-bold text-amber-800 block">達成連續 5 日溫習，獲得 $100 現金獎賞！💰</span>
                </div>

                <div class="text-2xl font-bold text-emerald-500 mb-6">🎉 完美拼出！</div>
                <button onclick="pickNextWord()" class="px-10 py-4 bg-emerald-600 text-white rounded-2xl font-bold text-lg hover:bg-emerald-700 transition-transform active:scale-95 shadow-lg shadow-emerald-200">學習下一題</button>
            </div>
        </div>
    </main>

    <!-- Modal 區域 (日曆與字庫，邏輯與之前相同) -->
    <!-- 獎勵日曆 -->
    <div id="calendar-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden-phase transition-opacity">
        <div class="bg-white w-11/12 max-w-md h-auto max-h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-fade-in-up">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-amber-50">
                <h2 class="text-2xl font-black text-amber-600 flex items-center gap-2">💰 獎勵日曆</h2>
                <button onclick="closeCalendar()" class="p-2 bg-white text-slate-600 rounded-full hover:bg-rose-100 hover:text-rose-600 shadow-sm transition-colors">✖</button>
            </div>
            <div class="p-6 overflow-y-auto flex flex-col gap-6">
                <div class="flex gap-4">
                    <div class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center">
                        <div class="text-sm font-bold text-slate-500 mb-1">虛擬錢包</div>
                        <div class="text-3xl font-black text-emerald-500">$<span id="modal-cash-display">0</span></div>
                    </div>
                    <div class="flex-1 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center">
                        <div class="text-sm font-bold text-amber-600 mb-1">連續打卡</div>
                        <div class="text-3xl font-black text-amber-500"><span id="modal-streak-display">0</span> 日</div>
                    </div>
                </div>
                <div class="bg-white border-2 border-slate-100 rounded-2xl p-5">
                    <div class="text-center font-bold text-slate-700 mb-4">下一階段獎賞 ($100) 距離：</div>
                    <div class="flex justify-between items-center relative z-10" id="streak-circles-container"></div>
                    <div class="h-2 bg-slate-100 rounded-full -mt-5 relative z-0 mx-4"></div>
                </div>
                <div class="bg-white border-2 border-slate-100 rounded-2xl p-5">
                    <div class="font-bold text-slate-700 mb-3 text-center">最近 7 日打卡紀錄</div>
                    <div class="flex justify-between" id="mini-calendar-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 字庫 -->
    <div id="word-bank-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden-phase transition-opacity">
        <div class="bg-white w-11/12 max-w-lg md:max-w-2xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-fade-in-up">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-emerald-50">
                <h2 class="text-2xl font-black text-emerald-700">我的專屬地理字庫</h2>
                <button onclick="closeWordBank()" class="p-2 bg-slate-200 text-slate-600 rounded-full hover:bg-rose-100 hover:text-rose-600 transition-colors">✖</button>
            </div>
            <div id="word-bank-list" class="flex-1 p-6 overflow-y-auto bg-slate-50 flex flex-col gap-4 no-scrollbar"></div>
        </div>
    </div>

    <script>
        // --- 核心變數與 API ---
        const GOOGLE_SHEET_CSV_URL = ""; // 留空以使用下方的地理專用備用字庫
        const apiKey = ""; // 放入你的 Gemini API Key
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";
        
        // --- 根據筆記抽取的地理專用字庫 ---
        const fallbackDatabase = [
            // Industrial Location (工業區位)
            { word: "TELECOMMUNICATION", hint: "Improvements in ______ help 豬豬 manage his overseas factories easily.", hint_chinese: "電訊的改善幫助豬豬輕鬆管理他的海外工廠。", chinese: "電訊", pos: "n." },
            { word: "INFRASTRUCTURE", hint: "New factories can improve the ______ of 豬豬's city, like roads and ports.", hint_chinese: "新工廠可以改善豬豬城市的基礎設施，例如道路和港口。", chinese: "基礎設施", pos: "n." },
            { word: "UNEMPLOYMENT", hint: "Closing factories in the home country leads to high ______ for 豬豬's neighbours.", hint_chinese: "關閉本土工廠導致豬豬的鄰居面臨高失業率。", chinese: "失業", pos: "n." },
            { word: "ECOSYSTEM", hint: "Building a factory on farmland will harm the ______ where 豬豬 plays.", hint_chinese: "在農田上建工廠會損害豬豬玩耍的生態系統。", chinese: "生態系統", pos: "n." },
            { word: "SUSTAINABLE", hint: "豬豬 wants to achieve ______ industrial development to protect the Earth.", hint_chinese: "豬豬希望實現可持續的工業發展以保護地球。", chinese: "可持續的", pos: "adj." },
            { word: "INVESTMENT", hint: "Foreign ______ helps build new schools and factories in 豬豬's city.", hint_chinese: "外國投資幫助在豬豬的城市建立新學校和工廠。", chinese: "投資", pos: "n." },
            { word: "SEWAGE", hint: "豬豬 is angry because the factory discharges untreated ______ into the river.", hint_chinese: "豬豬很生氣，因為工廠將未經處理的污水排放到河裡。", chinese: "污水", pos: "n." },
            { word: "TERTIARY", hint: "豬豬 wants to work in ______ industries like banking when he grows up.", hint_chinese: "豬豬長大後想在銀行業等第三產業工作。", chinese: "第三產業(的)", pos: "adj." },
            { word: "DECAY", hint: "Closing old factories may lead to urban ______ in 豬豬's neighborhood.", hint_chinese: "關閉舊工廠可能會導致豬豬的社區出現市區衰退。", chinese: "衰退", pos: "n." },
            
            // Energy Resources (能源)
            { word: "FOSSIL", hint: "Burning ______ fuels like coal produces a lot of energy for 豬豬's house.", hint_chinese: "燃燒像煤炭這樣的化石燃料為豬豬的家提供了大量能源。", chinese: "化石", pos: "n." },
            { word: "RENEWABLE", hint: "豬豬 uses ______ energy like solar power because its supply is infinite.", hint_chinese: "豬豬使用太陽能等可再生能源，因為其供應是無限的。", chinese: "可再生的", pos: "adj." },
            { word: "GEOTHERMAL", hint: "豬豬 visits a power plant that uses heat from the earth, called ______ power.", hint_chinese: "豬豬參觀了一座利用地熱的發電廠，稱為地熱能。", chinese: "地熱的", pos: "adj." },
            { word: "RADIOACTIVE", hint: "Uranium is dangerous because it is ______ and can harm 豬豬.", hint_chinese: "鈾是危險的，因為它具有放射性，可能會傷害豬豬。", chinese: "放射性的", pos: "adj." },
            { word: "CONTAMINATE", hint: "Leakage of nuclear waste can ______ the soil where 豬豬 grows carrots.", hint_chinese: "核廢料洩漏可能會污染豬豬種植胡蘿蔔的土壤。", chinese: "污染", pos: "v." },
            { word: "RESERVE", hint: "豬豬's country has a large ______ of coal deep underground.", hint_chinese: "豬豬的國家地下深處有大量的煤炭儲備。", chinese: "儲量 / 儲備", pos: "n." },
            { word: "EMIT", hint: "Old cars ______ a lot of air pollutants that make 豬豬 cough.", hint_chinese: "舊汽車排放大量空氣污染物，令豬豬咳嗽。", chinese: "排放", pos: "v." },
            { word: "RESPIRATORY", hint: "Air pollution causes ______ diseases for 豬豬 and his friends.", hint_chinese: "空氣污染導致豬豬和他的朋友患上呼吸系統疾病。", chinese: "呼吸系統的", pos: "adj." },
            { word: "EROSION", hint: "Cutting down trees causes severe soil ______ on 豬豬's farm.", hint_chinese: "砍伐樹木導致豬豬的農場出現嚴重的土壤侵蝕。", chinese: "侵蝕", pos: "n." },
            { word: "BARREN", hint: "Opencast mining makes the green land become a ______ wasteland for 豬豬.", hint_chinese: "露天開採使綠地變成對豬豬來說貧瘠的荒地。", chinese: "貧瘠的", pos: "adj." },
            { word: "RECESSION", hint: "High oil prices may cause a global economic ______, making 豬豬 poor.", hint_chinese: "高昂的油價可能會導致全球經濟衰退，令豬豬變窮。", chinese: "衰退 (經濟)", pos: "n." },

            // Climate Change (氣候變化)
            { word: "GREENHOUSE", hint: "豬豬 learns that ______ gases trap heat in the atmosphere.", hint_chinese: "豬豬了解到溫室氣體會將熱量困在大氣中。", chinese: "溫室", pos: "n." },
            { word: "RADIATION", hint: "More long-wave ______ is trapped, making 豬豬 feel very hot.", hint_chinese: "更多的長波輻射被困住，讓豬豬感到非常熱。", chinese: "輻射", pos: "n." },
            { word: "DEFORESTATION", hint: "豬豬 is sad because ______ destroys the homes of wild animals.", hint_chinese: "豬豬很傷心，因為砍伐森林破壞了野生動物的家園。", chinese: "砍伐森林", pos: "n." },
            { word: "GLACIER", hint: "Global warming causes the ______ to melt, raising the sea level for 豬豬's island.", hint_chinese: "全球暖化導致冰川融化，令豬豬居住的島嶼海平面上升。", chinese: "冰川", pos: "n." },
            { word: "METEOROLOGICAL", hint: "Climate change causes more ______ hazards like typhoons to hit 豬豬's city.", hint_chinese: "氣候變化導致更多像颱風這樣的氣象災害侵襲豬豬的城市。", chinese: "氣象的", pos: "adj." },
            { word: "INUNDATION", hint: "Rising sea levels may cause the ______ of 豬豬's coastal farmland.", hint_chinese: "海平面上升可能會導致豬豬的沿海農田被淹沒。", chinese: "淹沒", pos: "n." },
            { word: "REFUGEE", hint: "If the island sinks, 豬豬 will become a climatic ______.", hint_chinese: "如果島嶼沉沒，豬豬將成為氣候難民。", chinese: "難民", pos: "n." },
            { word: "HAZARD", hint: "A typhoon is a serious meteorological ______ that scares 豬豬.", hint_chinese: "颱風是令豬豬害怕的嚴重氣象災害。", chinese: "災害", pos: "n." },
            { word: "BLEACHING", hint: "Warm seawater causes coral ______, so 豬豬 cannot see colourful reefs.", hint_chinese: "溫暖的海水導致珊瑚白化，所以豬豬看不到色彩繽紛的礁石。", chinese: "白化", pos: "n." },
            { word: "EXTINCTION", hint: "Climate change may lead to the ______ of polar bears, making 豬豬 sad.", hint_chinese: "氣候變化可能導致北極熊滅絕，令豬豬很傷心。", chinese: "滅絕", pos: "n." }
        ];

        let availableWords = [], currentWord = null, gameState = 'loading', selectedLetters = [], scrambledLetters = [];
        const DAILY_TARGET = 5;
        let dailyCount = 0, completedHistory = {}, currentStreak = 0, totalCash = 0;
        
        // --- 【修改重點】將儲存金鑰更改為 geo_ 開頭，確保與舊版獨立 ---
        const KEY_BANK = 'geo_word_bank';
        const KEY_HISTORY = 'geo_history';
        const KEY_CASH = 'geo_cash';
        const KEY_DATE = 'geo_daily_date';
        const KEY_COUNT = 'geo_daily_count';

        // --- 工具與存儲邏輯 ---
        function getLocalYMD(dateObj) {
            const offset = dateObj.getTimezoneOffset();
            return new Date(dateObj.getTime() - (offset*60*1000)).toISOString().split('T')[0];
        }

        function calculateStreak(historyObj) {
            let streak = 0, checkDate = new Date();
            if (!historyObj[getLocalYMD(checkDate)]) checkDate.setDate(checkDate.getDate() - 1);
            while (historyObj[getLocalYMD(checkDate)]) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        function initStorage() {
            const todayStr = getLocalYMD(new Date());
            try { wordBank = JSON.parse(localStorage.getItem(KEY_BANK)) || []; } catch(e) { wordBank = []; }
            try { completedHistory = JSON.parse(localStorage.getItem(KEY_HISTORY)) || {}; } catch(e) { completedHistory = {}; }
            totalCash = parseInt(localStorage.getItem(KEY_CASH)) || 0;

            const storedDate = localStorage.getItem(KEY_DATE);
            if (storedDate === todayStr) {
                dailyCount = parseInt(localStorage.getItem(KEY_COUNT)) || 0;
            } else {
                dailyCount = 0;
                localStorage.setItem(KEY_DATE, todayStr);
                localStorage.setItem(KEY_COUNT, dailyCount);
            }

            currentStreak = calculateStreak(completedHistory);
            updateDailyUI();
            updateRewardsUI();
        }

        // --- UI 更新邏輯 ---
        function updateDailyUI() {
            document.getElementById('total-words-count').innerText = wordBank.length;
            const progressPercent = Math.min((dailyCount / DAILY_TARGET) * 100, 100);
            const bar = document.getElementById('daily-progress-bar');
            const textStatus = document.getElementById('daily-text-status');
            
            bar.style.width = `${progressPercent}%`;
            if (dailyCount >= DAILY_TARGET) {
                bar.classList.replace('bg-emerald-500', 'bg-amber-400');
                textStatus.innerHTML = `<span class="text-amber-500">已達標 🔥 (${dailyCount})</span>`;
            } else {
                bar.classList.replace('bg-amber-400', 'bg-emerald-500');
                textStatus.innerHTML = `<span class="text-emerald-600">${dailyCount} / ${DAILY_TARGET}</span>`;
            }
        }

        function updateRewardsUI() {
            document.getElementById('cash-display').innerText = totalCash;
            document.getElementById('modal-cash-display').innerText = totalCash;
            document.getElementById('streak-display').innerText = currentStreak;
            document.getElementById('modal-streak-display').innerText = currentStreak;
            
            let streakProgress = currentStreak % 5;
            if (currentStreak > 0 && streakProgress === 0) streakProgress = 5; 
            
            let circlesHtml = '';
            for(let i=1; i<=5; i++) {
                if (i <= streakProgress) circlesHtml += `<div class="w-8 h-8 rounded-full bg-amber-400 text-white flex items-center justify-center font-bold shadow-sm">✓</div>`;
                else if (i === 5) circlesHtml += `<div class="w-10 h-10 rounded-full bg-white border-4 border-amber-300 text-amber-500 flex items-center justify-center text-xl shadow-sm">💰</div>`;
                else circlesHtml += `<div class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-slate-400 text-xs">${i}</div>`;
            }
            document.getElementById('streak-circles-container').innerHTML = circlesHtml;

            let miniCalHtml = '';
            for(let i=6; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = getLocalYMD(d);
                let dayName = d.toLocaleDateString('zh-HK', { weekday: 'short' }).replace('星期', '');
                let isDone = completedHistory[dStr];
                miniCalHtml += `<div class="flex flex-col items-center gap-1"><div class="text-xs text-slate-400">${dayName}</div><div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold ${isDone ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-100 text-slate-300'}">${isDone ? '✓' : ''}</div></div>`;
            }
            document.getElementById('mini-calendar-container').innerHTML = miniCalHtml;
        }

        function handleWordSuccess() {
            const wordExists = wordBank.some(item => item.word.toUpperCase() === currentWord.word.toUpperCase());
            if (!wordExists) {
                wordBank.push({
                    word: currentWord.word.toUpperCase(), chinese: currentWord.chinese, hint: currentWord.hint, pos: currentWord.pos, hint_chinese: currentWord.hint_chinese || ''
                });
                localStorage.setItem(KEY_BANK, JSON.stringify(wordBank));
            }

            dailyCount++;
            localStorage.setItem(KEY_COUNT, dailyCount);
            updateDailyUI();

            if (dailyCount === DAILY_TARGET) {
                const todayStr = getLocalYMD(new Date());
                completedHistory[todayStr] = true;
                localStorage.setItem(KEY_HISTORY, JSON.stringify(completedHistory));
                currentStreak = calculateStreak(completedHistory);
                
                if (currentStreak > 0 && currentStreak % 5 === 0) {
                    totalCash += 100;
                    localStorage.setItem(KEY_CASH, totalCash);
                    document.getElementById('cash-reward-celebration').classList.remove('hidden-phase');
                    fireConfetti(true); 
                } else {
                    document.getElementById('daily-goal-celebration').classList.remove('hidden-phase');
                    fireConfetti(false); 
                }
                updateRewardsUI();
            }
        }

        function fireConfetti(isBigReward) {
            if (typeof confetti !== 'function') return;
            var duration = isBigReward ? 4000 : 2000;
            var end = Date.now() + duration;
            var colors = isBigReward ? ['#fbbf24', '#f59e0b', '#e11d48'] : ['#10b981', '#059669', '#f59e0b']; // 綠色系為主
            (function frame() {
                confetti({ particleCount: isBigReward ? 8 : 4, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                confetti({ particleCount: isBigReward ? 8 : 4, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // --- Modals 控制 ---
        function openCalendar() { updateRewardsUI(); document.getElementById('calendar-modal').classList.remove('hidden-phase'); }
        function closeCalendar() { document.getElementById('calendar-modal').classList.add('hidden-phase'); }
        function openWordBank() {
            document.getElementById('word-bank-modal').classList.remove('hidden-phase');
            const listContainer = document.getElementById('word-bank-list');
            if (wordBank.length === 0) { listContainer.innerHTML = '<div class="text-center text-slate-400 mt-10">字典空空如也</div>'; return; }
            listContainer.innerHTML = [...wordBank].reverse().map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div class="font-black text-xl text-emerald-800">${item.word.toLowerCase()}</div>
                    <div class="text-emerald-600 font-bold mb-1">${item.chinese}</div>
                    <div class="text-sm text-slate-500 italic">"${item.hint.replace('______', `<span class="underline">${item.word.toLowerCase()}</span>`)}"</div>
                    ${item.hint_chinese ? `<div class="mt-2 p-2 bg-slate-100 rounded text-sm text-slate-600 font-medium">中譯：${item.hint_chinese}</div>` : ''}
                </div>`).join('');
        }
        function closeWordBank() { document.getElementById('word-bank-modal').classList.add('hidden-phase'); }

        // --- AI API 呼叫 ---
        async function fetchGeminiAPI(promptText) {
            if(!apiKey) return "⚠️ 請先在代碼中填入 apiKey 才能使用 AI 功能！";
            const delays = [1000, 2000, 4000];
            const payload = { contents: [{ parts: [{ text: promptText }] }], systemInstruction: { parts: [{ text: "你是一位有趣、幽默、充滿創意的香港地理科老師。請使用繁體中文（可適當加入一點點香港口語令語氣更親切）回答，並確保解釋符合 DSE 地理科概念。回覆要盡量簡短、排版清晰易讀。" }] } };
            for (let i = 0; i < delays.length; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return (await response.json()).candidates[0].content.parts[0].text;
                } catch (error) {
                    if (i === delays.length - 1) return "哎呀，AI 老師暫時有少少塞車，請稍後再試！🙏";
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }
        
        async function generateAIStory() {
            const container = document.getElementById('ai-story-container');
            container.classList.remove('hidden-phase');
            container.innerHTML = `<div class="animate-pulse-slow text-purple-500 font-bold">✨ Gemini 正在結合地理概念編寫劇本...</div>`;
            const resultText = await fetchGeminiAPI(`請為地理科詞彙 "${currentWord.word}" (中文意思: ${currentWord.chinese}) 創作一個極短的雙語小故事（最多 3 句），並簡略帶出其地理學意義。主角必須是「豬豬」(Piggy)，內容要搞笑可愛。請將目標單字加粗顯示。`);
            container.innerHTML = resultText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-purple-700 bg-purple-100 px-1 rounded">$1</strong>').replace(/\n/g, '<br>');
        }
        
        async function generateAIMnemonic() {
            const container = document.getElementById('ai-mnemonic-container');
            container.classList.remove('hidden-phase');
            container.innerHTML = `<div class="animate-pulse-slow text-blue-500 font-bold">✨ Gemini 正在翻查地理記憶秘笈...</div>`;
            const resultText = await fetchGeminiAPI(`請提供一個有趣且容易記住的方法來拼寫地理專有名詞 "${currentWord.word}" (中文意思: ${currentWord.chinese})。可以使用字根字首、聯想或諧音。只需要最精華的記憶法。`);
            container.innerHTML = resultText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-700">$1</strong>').replace(/\n/g, '<br>');
        }
        
        function resetAIContainers() {
            document.getElementById('ai-story-container').classList.add('hidden-phase'); document.getElementById('ai-story-container').innerHTML = '';
            document.getElementById('ai-mnemonic-container').classList.add('hidden-phase'); document.getElementById('ai-mnemonic-container').innerHTML = '';
        }

        // --- 核心遊戲流程 ---
        function initGame() {
            initStorage();
            if(GOOGLE_SHEET_CSV_URL) {
                Papa.parse(GOOGLE_SHEET_CSV_URL, {
                    download: true, header: true,
                    complete: function(results) {
                        wordDatabase = results.data.filter(row => row.word && row.word.trim() !== "");
                        document.getElementById('db-status').innerText = "☁️ 雲端地理字庫";
                        resetAvailableWords();
                        nextWordLogic();
                    },
                    error: function() { loadFallback(); }
                });
            } else {
                loadFallback();
            }
        }

        function loadFallback() {
            wordDatabase = [...fallbackDatabase];
            document.getElementById('db-status').innerText = "📦 內置地理字庫";
            resetAvailableWords();
            nextWordLogic();
        }

        function resetAvailableWords() { availableWords = [...wordDatabase].sort(() => Math.random() - 0.5); }

        function nextWordLogic() {
            if (availableWords.length === 0) resetAvailableWords();
            currentWord = availableWords.pop();
            const letters = currentWord.word.toLowerCase().split('').map((c, i) => ({id: i, char: c}));
            scrambledLetters = [...letters].sort(() => Math.random() - 0.5);
            selectedLetters = [];
            gameState = 'study';
            
            document.getElementById('daily-goal-celebration').classList.add('hidden-phase');
            document.getElementById('cash-reward-celebration').classList.add('hidden-phase');
            resetAIContainers();
            updateUI();
        }

        function updateUI() {
            if(gameState === 'study') {
                document.getElementById('study-phase').classList.remove('hidden-phase');
                document.getElementById('spelling-phase').classList.add('hidden-phase');
                document.getElementById('study-word').innerText = currentWord.word.toLowerCase();
                document.getElementById('study-chinese').innerText = currentWord.chinese;
                const engSentence = currentWord.hint.replace('______', `<span class="text-emerald-700 font-bold underline decoration-2 underline-offset-4 px-1">${currentWord.word.toLowerCase()}</span>`);
                document.getElementById('study-sentence').innerHTML = `<p class="italic text-lg text-slate-700">"${engSentence}"</p>${currentWord.hint_chinese ? `<p class="mt-3 text-sm font-medium text-slate-500 bg-white p-2 rounded inline-block">中譯：${currentWord.hint_chinese}</p>` : ''}`;
            } else {
                document.getElementById('study-phase').classList.add('hidden-phase');
                document.getElementById('spelling-phase').classList.remove('hidden-phase');
                document.getElementById('spelling-chinese').innerText = currentWord.chinese;
                renderSpelling();
            }
        }

        function renderSpelling() {
            document.getElementById('slots-container').innerHTML = currentWord.word.split('').map((_, i) => `<div class="w-12 h-14 md:w-16 md:h-16 bg-slate-200 text-slate-800 text-2xl font-black rounded-2xl flex items-center justify-center shadow-inner transition-all">${selectedLetters[i]?.char || '_'}</div>`).join('');
            document.getElementById('pool-container').innerHTML = scrambledLetters.map((l, i) => `<button id="pool-btn-${i}" onclick="pick(${i})" class="w-12 h-14 md:w-16 md:h-16 bg-white border-2 border-slate-200 text-slate-700 text-2xl font-black rounded-2xl shadow-sm hover:border-emerald-400 hover:text-emerald-600 hover:-translate-y-1 transition-all active:scale-95">${l.char}</button>`).join('');
        }

        function pick(idx) {
            if(selectedLetters.length < currentWord.word.length) {
                // 獲取當前需要拼寫的正確字母 (小寫比較)
                const targetChar = currentWord.word[selectedLetters.length].toLowerCase();
                const pickedChar = scrambledLetters[idx].char.toLowerCase();

                if (pickedChar === targetChar) {
                    // 如果字母正確，加入到已選陣列並從字母池移除
                    selectedLetters.push(scrambledLetters[idx]);
                    scrambledLetters.splice(idx, 1);
                    
                    if(selectedLetters.length === currentWord.word.length) {
                        document.getElementById('pool-container').classList.add('hidden-phase');
                        document.getElementById('success-area').classList.remove('hidden-phase');
                        speakWord();
                        handleWordSuccess();
                    }
                    renderSpelling();
                } else {
                    // 如果字母錯誤，觸發震動與紅色警告效果
                    const btn = document.getElementById(`pool-btn-${idx}`);
                    if (btn) {
                        btn.classList.add('animate-shake', 'bg-rose-50', 'border-rose-400', 'text-rose-500');
                        setTimeout(() => {
                            if (btn) btn.classList.remove('animate-shake', 'bg-rose-50', 'border-rose-400', 'text-rose-500');
                        }, 400);
                    }
                }
            }
        }

        function pickNextWord() {
            document.getElementById('pool-container').classList.remove('hidden-phase');
            document.getElementById('success-area').classList.add('hidden-phase');
            nextWordLogic();
        }

        function backToStudy() {
            const letters = currentWord.word.toLowerCase().split('').map((c, i) => ({id: i, char: c}));
            scrambledLetters = [...letters].sort(() => Math.random() - 0.5);
            selectedLetters = [];
            document.getElementById('pool-container').classList.remove('hidden-phase');
            document.getElementById('success-area').classList.add('hidden-phase');
            gameState = 'study';
            updateUI();
        }

        function speakWord() { 
            if('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord.word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }
        
        function startSpelling() { gameState = 'spelling'; updateUI(); }
        window.onload = initGame;
    </script>
</body>
</html>
